services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hospital
      POSTGRES_PASSWORD: change_me
      POSTGRES_DB: hospital_hub
    ports:
      - "5432:5432"
    volumes:
      - hospital_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hospital -d hospital_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  hospital_postgres:
